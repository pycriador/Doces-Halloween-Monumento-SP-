<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coleta de Doces – Halloween 2026</title>
<style>
:root{--bg:#120b1f;--card:#1e1433;--tx:#f4eefc;--mu:#a99bc4;--bd:#32244f;--or:#ff8a1f}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at top,#2a1450,var(--bg) 55%) fixed;color:var(--tx);min-height:100vh}
main{max-width:720px;margin:0 auto;padding:20px 16px}
h1{margin:0 0 4px;font-size:1.7rem}h1 span{color:var(--or)}h2{margin:0 0 10px;font-size:1.1rem;color:var(--or)}
.sub{color:var(--mu);font-size:.9rem}
.torres{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:16px 0}
button,input[type=password],input[type=text]{font:inherit;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 14px}
button{cursor:pointer}.torres button{font-weight:700;font-size:1.05rem}
.torres button.on,.acao{background:var(--or);color:#1a0d00;border-color:var(--or);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.chip{background:#2b1d47;border-radius:999px;padding:4px 14px;font-weight:600}
textarea{width:100%;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#150d26;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:6px 0 10px}
label{color:var(--mu);font-size:.9rem}.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.riscado{text-decoration:line-through;opacity:.5}.ok{color:#7ddc7d}.erro{color:#ff7b7b;margin-top:10px}.rodape{text-align:center;margin-top:28px;font-size:.9rem}
a{color:var(--mu)}#fLogin input[type=password],#fLogin input[type=text]{width:100%;margin-bottom:10px}
</style>
</head>
<body>
<main>
 <h1>🎃 Coleta de Doces <span>Halloween 2026</span></h1>
 <div class="sub">Condomínio Monumento São Paulo · Atualizado em <span id="at"></span></div>
 <p>Toque em uma torre para ver os apartamentos participantes e a mensagem para o WhatsApp.</p>
 <div class="torres" id="bts"></div>
 <section class="card" id="res" hidden>
  <h2 id="rTit"></h2>
  <div class="chips" id="rChips"></div>
  <label for="rMsg">Mensagem para o WhatsApp</label>
  <textarea id="rMsg" readonly rows="9"></textarea>
  <div class="acoes"><button class="acao" id="bCop">Copiar mensagem</button><button id="bWpp">Abrir no WhatsApp</button><span id="rOk" class="ok"></span></div>
 </section>
 <p class="rodape"><a href="#" id="lnkAdm">🔒 Administração</a></p>
 <form class="card" id="fLogin" hidden autocomplete="off">
  <h2>🔒 Administração</h2>
  <input id="seg" type="password" placeholder="Chave de acesso" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" required>
  <label><input type="checkbox" id="ver"> Mostrar chave</label><br><br>
  <button class="acao" id="bEnt" type="submit">Entrar</button>
  <div id="erro" class="erro"></div>
 </form>
</main>

  P = {}; d.apartamentos.slice().sort((a,b)=>a.torre.localeCompare(b.torre)||a.apto-b.apto).forEach(x=>(P[x.torre]=P[x.torre]||[]).push(x));
  T = Object.keys(P); $('at').textContent = d.editadoEm || d.atualizado;
  $('bts').innerHTML = [...T,'*'].map(t=>`<button data-t="${t}">${t==='*'?'Todas':'Torre '+t}</button>`).join('');
  if(sel && (sel==='*' || P[sel])) mostrar(sel); else { sel = null; $('res').hidden = true; }
}
$('bts').onclick = e => { const t = e.target.dataset && e.target.dataset.t; if(!t) return; mostrar(t); $('res').scrollIntoView({behavior:'smooth',block:'nearest'}); };
iniciar(P0);   /* versão embutida; em seguida carrega a lista publicada (participantes.json), que pode ter sido editada à mão */
try{ fetch('participantes.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{ if(d && Array.isArray(d.apartamentos)) iniciar(d); }).catch(()=>{}); }catch(e){}
$('bCop').onclick = async () => {
  try{ await navigator.clipboard.writeText($('rMsg').value); }catch(e){ $('rMsg').select(); document.execCommand('copy'); }
  $('rOk').textContent = '✔ Copiado!'; setTimeout(()=>$('rOk').textContent='',3000);
};
$('bWpp').onclick = () => window.open('https://wa.me/?text='+encodeURIComponent($('rMsg').value),'_blank');

/* ---- Administração: só abre com a chave correta (descriptografia no próprio navegador) ---- */
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrirAdmin(segredo){
  const ks = JSON.parse($('ks').textContent), pl = JSON.parse($('pl').textContent), s = crypto.subtle;
  const base = await s.importKey('raw', new TextEncoder().encode(segredo), 'PBKDF2', false, ['deriveKey']);
  const k = await s.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b(ks.kdf.salt),iterations:ks.kdf.iter}, base, {name:'AES-GCM',length:256}, false, ['decrypt']);
  const priv = await s.decrypt({name:'AES-GCM',iv:b(ks.priv.iv)}, k, b(ks.priv.ct));      // falha se a chave estiver errada
  const pk = await s.importKey('pkcs8', priv, {name:'RSA-OAEP',hash:'SHA-256'}, false, ['decrypt']);
  const dek = await s.importKey('raw', await s.decrypt({name:'RSA-OAEP'}, pk, b(pl.w)), 'AES-GCM', false, ['decrypt']);
  const html = new TextDecoder().decode(await s.decrypt({name:'AES-GCM',iv:b(pl.iv)}, dek, b(pl.ct)));
  document.open(); document.write(html); document.close();
}
window.abrirAdmin = abrirAdmin;
$('lnkAdm').onclick = e => { e.preventDefault(); $('fLogin').hidden = false; $('seg').focus(); };
$('ver').onchange = () => $('seg').type = $('ver').checked ? 'text' : 'password';
$('fLogin').onsubmit = async e => {
  e.preventDefault(); $('erro').textContent = '';
  if(!(window.crypto && crypto.subtle)){ $('erro').textContent = 'Este navegador não permite a criptografia. Abra o link com https no Chrome ou Safari.'; return; }
  $('bEnt').disabled = true; $('bEnt').textContent = 'Verificando…';
  try{ await abrirAdmin($('seg').value.replace(/\s+/g,'').toLowerCase()); }
  catch(err){ $('erro').textContent = 'Chave incorreta.'; $('bEnt').disabled = false; $('bEnt').textContent = 'Entrar'; $('seg').select(); }
};
